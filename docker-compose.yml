services:
  # Single-broker Kafka in KRaft mode (no separate Zookeeper container --
  # KRaft is Kafka's newer built-in way of managing cluster metadata).
  # One broker/one partition is plenty for a demo; a real deployment
  # would run a multi-broker cluster instead.
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  # Doubles as both the "warehouse" the Spark job writes into and the
  # source the dashboard reads from. init.sql runs automatically the
  # first time this container starts, creating raw_trades and
  # price_metrics_1m.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warehouse
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  producer:
    build: ./producer
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: crypto_trades
      SYMBOLS: btcusdt,ethusdt,bnbusdt,solusdt,xrpusdt,adausdt,dogeusdt,trxusdt,dotusdt,ltcusdt,bchusdt,avaxusdt,linkusdt,atomusdt,xlmusdt,etcusdt,nearusdt,uniusdt,filusdt,aptusdt
      # Binance is only reachable through the host's SOCKS5 proxy on this
      # network. host.docker.internal is Docker Desktop's special DNS
      # name for "the machine this container is running on."
      WS_PROXY_HOST: host.docker.internal
      WS_PROXY_PORT: "10808"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  spark-consumer:
    build: ./spark_consumer
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: crypto_trades
      PG_JDBC_URL: jdbc:postgresql://postgres:5432/warehouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    environment:
      PG_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/warehouse
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
